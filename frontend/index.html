<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ConceptIntel - AI Knowledge Graph Concept Platform</title>

    <!-- Meta Descriptions for SEO -->
    <meta name="description" content="AI-powered Concept Intelligence platform for mapping and tracking concept mastery." />

    <!-- Font Preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Applied before first paint (outside React) to avoid a light/dark flash:
         mirrors the same localStorage key + prefers-color-scheme fallback that
         ThemeContext (src/contexts/ThemeContext.tsx) uses once React mounts. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('conceptintel-theme');
          var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-text-primary overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
