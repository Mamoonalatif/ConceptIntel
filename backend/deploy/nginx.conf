# Reverse proxy for the ConceptIntel backend - install as
# /etc/nginx/sites-available/conceptintel-backend and symlink into sites-enabled.
# Run certbot afterwards to fill in the TLS server block automatically.
server {
    listen 80;
    server_name api.yourdomain.com;  # or the VM's public IP if you have no domain yet

    client_max_body_size 30M;  # matches MAX_FILE_SIZE (25MB) in app/assignments/routes.py etc.

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # AI grading/generation calls can take up to 60s
    }
}
